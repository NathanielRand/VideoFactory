# Installers for Video Factory: Windows (NSIS), macOS (dmg) and Linux (AppImage,
# deb). Each is built natively on its own OS, because the frozen Python engine
# cannot be cross-compiled: `pnpm run package` (Windows), `package:mac`,
# `package:linux`, or scripts/build_installer.py, which picks the right one.
#
# The Windows story, which the rest of this file mostly tells:
#
# Produces an NSIS installer that carries everything the app needs: the
# Electron front end, the frozen Python engine, FFmpeg, and the YOLO
# weights. A creator installs it and pastes a link — no Python, no PATH,
# no terminal.
#
# Built by scripts/build_installer.py, which freezes the backend first and
# leaves it in build/dist/backend/ for the extraResources rule below.

# Video Factory: appId and package.json "name" were renamed once, when
# nobody had an installed copy. From here on they are frozen, for these reasons:
#
#   * package.json "name" (video-factory) is what Electron derives userData
#     from — %APPDATA%\video-factory — which holds localStorage: the caption
#     style, the 60s+/podcast/longform toggles, the chosen interface language
#     and update-prefs.json. Rename it and every user's settings vanish on
#     upgrade while looking like a bug.
#   * appId is the Windows application identity, and changing it makes the
#     installer treat the new version as a different app rather than an
#     upgrade.
#
appId: com.videofactory.app
productName: Video Factory
copyright: Copyright © 2026 Nathaniel Rand. Portions © 2026 ColinGPT9 (AGPL-3.0)

directories:
  output: ../release
  buildResources: build

# Embeds build/icon.ico into the packaged .exe. electron-builder would
# normally do this itself, but the tool it uses ships in the same archive as
# the macOS symlinks that an ordinary Windows account cannot extract — see
# signAndEditExecutable below. Without this the app keeps Electron's default
# atom icon on the shortcut, taskbar and Alt-Tab.
afterPack: build/afterPack.cjs

files:
  - out/**/*
  - package.json

# Everything that is not JavaScript rides along here. asar would corrupt the
# native DLLs in the backend, so these stay as plain files on disk.
extraResources:
  # The frozen Python engine. Electron spawns resources/backend/api.exe —
  # see startBackend() in src/main/index.ts.
  #
  # FFmpeg rides along inside this folder: the PyInstaller spec already
  # places it at _internal/ffmpeg/, which core.binaries searches relative to
  # the executable. Copying vendor/ffmpeg again here would ship a second
  # 204 MB copy of the same two binaries.
  - from: ../build/dist/backend
    to: backend
    filter:
      - "**/*"
  # The tray icon on macOS and Linux. Windows reads its tray icon out of the
  # exe itself; elsewhere there is no such trick, so the image ships as a file.
  - from: build/icon.png
    to: icon.png

win:
  # nsis-web, not plain nsis. makensis.exe is a 32-bit program: it memory-maps
  # the payload to embed it in the installer, so it dies at roughly 2 GB with
  # "failed creating mmap". This app is ~5 GB unpacked, almost all of it CUDA
  # PyTorch, so a single-file installer is not possible at all.
  #
  # A web installer is the better answer anyway at this size: the setup .exe
  # is small and starts instantly, and the big download is resumable — which
  # matters a lot when it is several gigabytes over a home connection.
  #
  # The zip target is the offline fallback: no installer, no shortcuts, but
  # it works with no network and can be copied onto a machine by hand.
  target:
    - target: nsis-web
      arch:
        - x64
    - target: zip
      arch:
        - x64
  artifactName: VideoFactory-${version}-${arch}.${ext}
  # No code-signing certificate yet. Windows SmartScreen will warn on first
  # run until the installer builds reputation or a certificate is bought —
  # documented in the release notes so it doesn't look like a virus.
  #
  # Skipping the sign-and-edit step keeps the build working on an ordinary
  # Windows account. electron-builder otherwise downloads a signing bundle
  # that contains macOS symlinks, and extracting those needs Developer Mode
  # or admin rights — it fails with "Cannot create symbolic link: A required
  # privilege is not held by the client" on a normal machine.
  #
  # The cost is that the app .exe carries no embedded icon or version
  # metadata. To get those back once there is an icon and a certificate:
  # turn on Windows Developer Mode (Settings > System > For developers),
  # then delete this line.
  signAndEditExecutable: false

# macOS. Apple Silicon only: PyTorch no longer publishes Intel Mac wheels, so an
# x64 build would mean a second engine with a different feature set. macOS 14 or
# newer, because OpenCV's current wheels are not published for older systems
# (checked with pip against macosx_11_0 and macosx_14_0).
#
# UNSIGNED, and that needs saying precisely. An arm64 app with NO signature at
# all will not launch: macOS reports "is damaged and can't be opened", with no
# way past it in the UI. So the build is AD-HOC signed (identity "-"), which
# satisfies the kernel but not Gatekeeper: users get "Apple could not verify
# ..." and must allow it once in System Settings > Privacy & Security ("Open
# Anyway"), or run `xattr -dr com.apple.quarantine "/Applications/Video
# Factory.app"`. See docs/MACOS.md.
#
# hardenedRuntime is off because ad-hoc signing plus hardened runtime makes
# macOS refuse the Electron frameworks (different Team ID). To ship properly
# with a Developer ID: delete `identity`, set hardenedRuntime to true, and
# provide CSC_LINK / CSC_KEY_PASSWORD plus notarization credentials. The
# entitlements the engine needs are already in build/entitlements.mac.plist.
mac:
  target:
    - target: dmg
      arch:
        - arm64
    # Also a zip: electron-updater reads updates from the zip on macOS, and it
    # doubles as the no-dmg fallback.
    - target: zip
      arch:
        - arm64
  category: public.app-category.video
  minimumSystemVersion: "14.0"
  icon: build/icon.png
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: VideoFactory-${version}-${arch}.${ext}

dmg:
  title: Video Factory ${version}

# Linux. x64. One build: it carries CUDA PyTorch when the build machine has it
# and a CPU one when not (scripts/build_installer.py says which). The app falls
# back to the CPU on its own either way.
#
# AppImage and deb, not Flatpak or Snap yet. Known quirk, documented in
# docs/LINUX.md: on Ubuntu 24.04+ an AppImage may refuse to start because
# unprivileged user namespaces are restricted for Electron's sandbox. The deb
# does not have this problem (it installs chrome-sandbox setuid).
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  category: AudioVideo
  icon: build/icon.png
  maintainer: Nathaniel Rand <nathanieljrand@gmail.com>
  synopsis: Source to post, in one flow
  description: Grab videos, clip them or build compilations, add branding, render for every platform, then post or schedule. Runs on your own machine.
  artifactName: VideoFactory-${version}-${arch}.${ext}

# Microsoft Store packaging. NOT part of the default build: `win.target` above
# is untouched, and this target is selected explicitly by
# scripts/build_msix.py, so `pnpm run package` still produces exactly the
# installer it always did.
#
# Only one capability is declared — runFullTrust — because that is all a
# packaged desktop app needs. The app spawns its own engine and Ollama, reads
# and writes its own per-user folder, and asks Windows for nothing else.
#
# THE THREE IDENTITY VALUES BELOW COME FROM PARTNER CENTER and must match it
# character for character, capitals included. They are not secrets — every one
# of them ships inside the manifest of the package itself. Re-read them at:
#   Partner Center -> Video Factory -> General -> View product identity
# A mismatch is not caught at build time; it fails at upload, after the package
# has already been made. See docs/MSSTORE.md.
appx:
  # "Package/Identity/Name"
  identityName: VideoFactory.VideoFactory
  # "Package/Identity/Publisher" — the full subject, not just the GUID.
  publisher: CN=82A1C822-C6B7-41D5-889B-160627060939
  # "Package/Properties/PublisherDisplayName" — shown on the Store listing.
  publisherDisplayName: Video Factory
  # Ours to choose, not Microsoft's. Must not start with a digit and must not
  # change between releases: it is part of the app's identity to Windows.
  applicationId: VideoFactory
  displayName: Video Factory
  backgroundColor: '#0A1628'
  languages:
    - en-US
  # Version is NOT read from package.json for the Store: Microsoft forbids a
  # major of 0, so build_msix.py computes it. See that script and docs/MSSTORE.md.
  setBuildNumber: false

# These apply to the web installer too — nsisWeb inherits from nsis.
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Video Factory
  # The payload is several gigabytes, so give the user a real progress
  # dialog rather than a frozen window.
  deleteAppDataOnUninstall: false
  # Leaving data/ behind on uninstall is deliberate: it holds the creator's
  # downloaded videos, rendered clips and learned creator profiles. Removing
  # a program should never delete someone's footage.

nsisWeb:
  artifactName: VideoFactory-Web-Setup-${version}.${ext}

compression: maximum

# Where the Web Setup fetches its payload, and where the update wizard reads
# its feed. Both come from the same place, so they cannot disagree about what
# the latest version is.
#
# NOT GitHub Releases, even though the code lives there. A release asset is
# capped at 2 GiB and the payload is already over it:
#
#   video-factory-<v>-x64.nsis.7z   5.90 GiB   (measured at 1.1.3)
#   VideoFactory-<v>-x64.zip         6.92 GiB
#
# Uploading either one fails, which is why nothing has shipped yet. Hugging
# Face has no such cap, costs nothing, serves from a CDN, and this project
# already pushes to it (see docs/MIRRORS.md) — so the payload goes there and
# the GitHub release carries only the ~1 MB setup .exe and the notes.
#
# `generic` rather than a Hugging Face provider because electron-builder has
# no HF provider; a plain HTTPS base URL is all the updater needs, and
# huggingface.co/<repo>/resolve/main/<file> is exactly that.
# No update feed yet. Without a feed the
# packaged app's launch check fails quietly (see ui/src/main/updater.ts).
# Add our own feed here before shipping a build to anyone.
publish: null
